name: Render Output PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-pdfs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nehnutelnosti:
              - 'src/genMd2Pdf-Nehnutelnosti.py'
              - '2026-ZoznamNehnutelnosti.md'
            vlastnici:
              - 'src/genMd2Pdf-vlastnici.py'
              - '2026-10-22-ZoznamVlastnikov.md'
            zmluva:
              - 'src/genMd2Pdf-zmluva.py'
              - '*Stanovy*.md'
              - '*Zmluva*.md'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libjpeg-dev \
            libopenjp2-7-dev \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

     # 1. Nehnuteľnosti
      - name: Run Nehnutelnosti Renderer
        run: |
          python src/genMd2Pdf-Nehnutelnosti.py "2026-ZoznamNehnutelnosti.md"
        if: steps.filter.outputs.nehnutelnosti == 'true' || github.event_name == 'workflow_dispatch' || !hashFiles('pdf/2026-ZoznamNehnutelnosti.pdf')

      # 2. Vlastníci
      - name: Run Vlastnici Renderer
        run: |
          python src/genMd2Pdf-vlastnici.py "2026-10-22-ZoznamVlastnikov.md"
        if: steps.filter.outputs.vlastnici == 'true' || github.event_name == 'workflow_dispatch' || !hashFiles('pdf/2026-10-22-ZoznamVlastnikov.pdf')

        
      # 3. Zmluva / Stanovy
      - name: Run Zmluva / Stanovy Renderer
        run: |
          if ls *Stanovy*.md 1> /dev/null 2>&1; then
            FILE_STANOVY=$(ls *Stanovy*.md | head -n 1)
            echo "Spúšťam pre stanovy: $FILE_STANOVY"
            python src/genMd2Pdf-zmluva.py "$FILE_STANOVY"
          fi
          if ls *Zmluva*.md 1> /dev/null 2>&1; then
            FILE_ZMLUVA=$(ls *Zmluva*.md | head -n 1)
            echo "Spúšťam pre zmluvu: $FILE_ZMLUVA"
            python src/genMd2Pdf-zmluva.py "$FILE_ZMLUVA"
          fi
        if: steps.filter.outputs.zmluva == 'true' || github.event_name == 'workflow_dispatch' || !hashFiles('pdf/*Stanovy*.pdf') || !hashFiles('pdf/*Zmluva*.pdf')

      - name: Commit and push generated PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f pdf/*.pdf || true
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-render updated PDFs via GitHub Actions [skip ci]" && git push)
